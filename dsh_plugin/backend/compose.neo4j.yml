services:
  docsqa-neo4j:
    image: neo4j:2026.06.0
    container_name: docsqa-plugin-neo4j
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: neo4j/secretgraph
    volumes:
      - ../plugin/data/neo4j/database:/data
      - ../plugin/data/neo4j/traces/neo4j:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p secretgraph 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
