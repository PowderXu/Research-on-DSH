[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsqa-benchmark"
version = "0.3.0"
description = "Dataset construction, retrieval, and answer-quality evaluation for linked technical documentation"
requires-python = ">=3.10"
dependencies = [
  "hnswlib==0.8.0",
  "numpy>=1.26,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
retrieval = [
  "sentence-transformers>=3,<4",
]
graph = [
  "neo4j>=5.26,<7",
]
judge = [
  "openai>=2,<3",
  "Pillow>=10,<13",
  "pydantic>=2,<3",
]
rule-optimization = [
  "openai>=2,<3",
  "pydantic>=2,<3",
  "skillopt==0.2.0",
]
test = [
  "pytest>=8,<10",
]
all = [
  "sentence-transformers>=3,<4",
  "neo4j>=5.26,<7",
  "pytest>=8,<10",
  "openai>=2,<3",
  "Pillow>=10,<13",
  "pydantic>=2,<3",
  "skillopt==0.2.0",
]

[project.scripts]
docsqa-combine-datasets = "dataset.scripts.combine_datasets:main"
docsqa-prepare-corpus = "dataset.scripts.prepare_unified_corpus:main"
docsqa-build = "dataset.scripts.build:main"
docsqa-plugin-eval = "kbbench.plugin_eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kbbench*", "dataset*", "dataset_analysis*", "rule_optimization*"]

[tool.pytest.ini_options]
testpaths = ["tests", "../dsh_plugin/tests"]
pythonpath = [".", ".."]
addopts = "-q"
